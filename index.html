<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桃區班表查詢</title>
<style>
  :root {
    --bg: #f5f4f1; --surface: #fff; --border: #e0ddd8; --border-dark: #c8c5be;
    --text: #1a1917; --muted: #6b6963; --hint: #9c9990;
    --accent: #1a5fb4; --accent-bg: #e8f0fb;
    --green: #2a7d4f; --green-bg: #e8f5ee;
    --blue: #1a5fb4; --blue-bg: #e8f0fb; --blue-border: #b5d4f4;
    --purple: #6d28d9; --purple-l: #7c3aed; --purple-bg: #f5f0ff; --purple-border: #c4b5fd; --purple-pill: #ede9fe;
    --r: 8px; --rl: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,"Noto Sans TC",sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; height: 56px; position: sticky; top: 0; z-index: 10; gap: 1rem; }
  header h1 { font-size: 15px; font-weight: 600; }
  .dept { font-size: 13px; color: var(--muted); margin-left: 4px; }
  .badge-updated { margin-left: auto; font-size: 12px; color: var(--hint); }
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 1.25rem; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  .sec-lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--hint); margin-bottom: .25rem; }
  select, input[type=date] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); color: var(--text); font-size: 14px; appearance: none; cursor: pointer; }
  select:focus, input[type=date]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .mode-group { display: flex; flex-direction: column; gap: 6px; }
  .mode-btn { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); color: var(--muted); font-size: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 9px; transition: all .12s; line-height: 1.3; }
  .mode-btn:hover { border-color: var(--border-dark); color: var(--text); background: var(--surface); }
  .mode-btn.act-surplus  { border-color: var(--purple-l); background: var(--purple-bg); color: var(--purple); font-weight: 500; }
  .mode-btn.act-going    { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); font-weight: 500; }
  .mode-btn.act-onshift  { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .d-purple { background: var(--purple-l); }
  .d-blue   { background: var(--blue); }
  .d-green  { background: var(--green); }
  .divider { border: none; border-top: 1px solid var(--border); }
  .btn-query { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .12s; margin-top: auto; }
  .btn-query:hover { opacity: .87; }
  main { padding: 1.5rem; }
  .result-bar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 1.25rem; }
  .result-title { font-size: 16px; font-weight: 600; }
  .result-sub { font-size: 13px; color: var(--muted); }
  .surplus-banner { background: var(--purple-bg); border: 1px solid var(--purple-border); border-radius: var(--rl); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .surplus-banner-lbl { font-size: 12px; color: var(--purple-l); font-weight: 500; margin-bottom: 2px; }
  .surplus-banner-date { font-size: 13px; color: var(--purple); font-weight: 600; }
  .surplus-banner-num { font-size: 28px; font-weight: 700; color: var(--purple-l); line-height: 1; }
  .surplus-banner-num span { font-size: 13px; font-weight: 500; margin-left: 2px; }
  .store-block { margin-bottom: 1.25rem; }
  .store-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: var(--r); margin-bottom: 6px; }
  .sh-surplus { background: var(--purple-bg); border: 1px solid var(--purple-border); }
  .sh-going   { background: var(--blue-bg);   border: 1px solid var(--blue-border); }
  .sh-name { font-size: 12px; font-weight: 600; }
  .sh-surplus .sh-name { color: var(--purple); }
  .sh-going   .sh-name { color: var(--blue); }
  .pill { font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; margin-left: 6px; }
  .pill-purple { background: var(--purple-pill); color: var(--purple-l); }
  .pill-blue   { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
  .emp-list { display: flex; flex-direction: column; gap: 4px; }
  .emp-card { display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
  .emp-card:hover { border-color: var(--border-dark); }
  .emp-name { font-size: 14px; font-weight: 500; }
  .star { color: #c88000; font-size: 11px; margin-left: 3px; }
  .emp-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .tag-ok     { background: var(--green-bg); color: var(--green); }
  .tag-going  { background: var(--blue-bg);  color: var(--blue); }
  .dest-lbl { font-size: 11px; color: var(--blue); margin-top: 3px; text-align: right; }
  .phone-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); text-decoration: none; padding: 2px 6px; border: 0.5px solid var(--accent); border-radius: 6px; margin-left: 8px; }
  .phone-btn:hover { background: var(--accent-bg); }
  .dp-btn { color: #0f766e; border-color: #0f766e; font-weight: 600; }
  .dp-btn:hover { background: #e6f6f4; }
  .sh-name { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
  .nav-btn { color: #c2410c; border-color: #c2410c; font-weight: 600; }
  .nav-btn:hover { background: #fff7ed; }
  .nav-btn svg { flex-shrink: 0; }
  .dest-nav { color: #c2410c; }
  .dest-call { color: #0f766e; text-decoration: none; font-weight: 600; margin-left: 4px; }
  .store-head { gap: 8px; }
  .sh-name { flex: 1; min-width: 0; }
  .app-icons { display: inline-flex; gap: 8px; flex-shrink: 0; }
  .app-icon { width: 36px; height: 36px; border-radius: 22.5%; display: inline-flex; background: #fff; align-items: center; justify-content: center; text-decoration: none; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08); transition: transform .1s; -webkit-tap-highlight-color: transparent; }
  .app-icon:active { transform: scale(.9); }
  .app-icon img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .app-icons.sm { gap: 6px; margin-top: 5px; justify-content: flex-end; display: flex; }
  .app-icons.sm .app-icon { width: 26px; height: 26px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #1a1917; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 1rem; opacity: .35; }
  .empty-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }
  .dept-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dept-tab { padding: 8px 6px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); color: var(--muted); font-size: 13px; cursor: pointer; transition: all .12s; }
  .dept-tab:hover { border-color: var(--border-dark); color: var(--text); }
  .dept-tab.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .dept-tab.all { grid-column: 1 / -1; }
  .dept-chip { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--accent-bg); color: var(--accent); margin-right: 6px; }
  .stale-warn { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: var(--r); padding: 8px 12px; font-size: 12px; margin-bottom: 1rem; }
  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>班表查詢 <span class="dept" id="deptLabel"></span></h1>
  <div class="badge-updated" id="updatedBadge">載入中...</div>
</header>
<div class="layout">
  <aside>
    <div>
      <div class="sec-lbl">營業部</div>
      <div class="dept-tabs" id="deptTabs"></div>
    </div>
    <div>
      <div class="sec-lbl">日期</div>
      <input type="date" id="qdate">
    </div>
    <div>
      <div class="sec-lbl">門市</div>
      <select id="storeFilter"><option value="">全部門市</option></select>
    </div>
    <div class="divider"></div>
    <div>
      <div class="sec-lbl" style="margin-bottom:.5rem">查詢模式</div>
      <div class="mode-group">
        <button class="mode-btn act-surplus" id="btn-surplus" onclick="setMode('surplus')">
          <span class="dot d-purple"></span>
          <span>可支援門市<br><span style="font-size:11px;font-weight:400;opacity:.75">上班 3 人以上的門市</span></span>
        </button>
        <button class="mode-btn" id="btn-going" onclick="setMode('going')">
          <span class="dot d-blue"></span>
          <span>支援他店<br><span style="font-size:11px;font-weight:400;opacity:.75">當天被派去支援的人員</span></span>
        </button>
        <button class="mode-btn" id="btn-onshift" onclick="setMode('onshift')">
          <span class="dot d-green"></span>
          <span>當天上班人員<br><span style="font-size:11px;font-weight:400;opacity:.75">全部門市今日上班名單</span></span>
        </button>
      </div>
    </div>
    <button class="btn-query" onclick="query()">查詢</button>
  </aside>
  <main id="main">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">設定條件後點擊查詢</div>
      <div class="empty-sub">選擇營業部、日期與查詢模式</div>
    </div>
  </main>
</div>

<div id="toast"></div>
<script>
let DATA = null;
let currentMode = 'surplus';
let currentDept = '';      // '' = 全部營業部
let STORES = {};           // 目前營業部的門市資料
let STORE_DEPT = {};       // 門市 → 營業部名稱

function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function loadPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function buildDeptTabs() {
  var wrap = document.getElementById('deptTabs');
  var codes = Object.keys(DATA.depts);
  var html = '';
  codes.forEach(function(c) {
    html += '<button class="dept-tab' + (c === currentDept ? ' active' : '') +
      '" onclick="setDept(\'' + c + '\')">' + DATA.depts[c].label + '</button>';
  });
  wrap.innerHTML = html;
}

function setDept(code) {
  currentDept = code;
  savePref('dept', code);
  STORES = {}; STORE_DEPT = {};
  var codes = code ? [code] : Object.keys(DATA.depts);
  codes.forEach(function(c) {
    var d = DATA.depts[c];
    Object.keys(d.stores || {}).forEach(function(s) {
      STORES[s] = d.stores[s];
      STORE_DEPT[s] = d.label;
    });
  });
  document.getElementById('deptLabel').textContent =
    code ? (DATA.depts[code].name || DATA.depts[code].label) : '桃區全部營業部';
  var sel = document.getElementById('storeFilter');
  sel.innerHTML = '<option value="">全部門市</option>';
  Object.keys(STORES).forEach(function(s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  buildDeptTabs();
  query();
}

function deptChip(storeName) {
  return currentDept === '' && STORE_DEPT[storeName]
    ? '<span class="dept-chip">' + STORE_DEPT[storeName] + '</span>' : '';
}

function staleWarning() {
  var list = (DATA.meta.depts || []).filter(function(d) {
    return !d.ok && (currentDept === '' || d.code === currentDept);
  });
  if (!list.length) return '';
  return '<div class="stale-warn">⚠ ' + list.map(function(d) {
    return d.label + ' 今日更新失敗' + (d.updated ? '，顯示 ' + d.updated.slice(5, 16) + ' 的資料' : '，無資料');
  }).join('；') + '</div>';
}

async function loadData() {
  var step = '讀取 schedule.json';
  try {
    if (location.protocol === 'file:') {
      throw new Error('直接開啟本機檔案時，瀏覽器不允許讀取 schedule.json。請用 GitHub 網址，或資料夾裡的 open_dashboard.bat 開啟');
    }
    const res = await fetch('schedule.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('schedule.json 讀取失敗（HTTP ' + res.status + '）');
    step = '解析 schedule.json';
    var text = await res.text();
    try { DATA = JSON.parse(text); }
    catch (je) { throw new Error('schedule.json 格式錯誤：' + je.message); }
    step = '整理資料';
    DATA.meta = DATA.meta || {};
    var year = +DATA.meta.year || new Date().getFullYear();
    var month = +DATA.meta.month || (new Date().getMonth() + 1);
    DATA.meta.year = year; DATA.meta.month = month;
    var updated = String(DATA.meta.updated || '');
    document.getElementById('updatedBadge').textContent =
      year + '年' + month + '月班表' + (updated ? '　更新：' + updated.slice(0, 16) : '');
    // 舊版資料（沒有 depts）→ 視為單一營業部
    if (!DATA.depts || !Object.keys(DATA.depts).length) {
      DATA.depts = { '03902B': { label: '桃二部', name: '桃區營業二部', stores: DATA.stores || {} } };
    }
    Object.keys(DATA.depts).forEach(function(c) {
      var d = DATA.depts[c] || {};
      d.label = d.label || c; d.name = d.name || d.label; d.stores = d.stores || {};
      DATA.depts[c] = d;
    });
    var t = new Date();
    var qd = document.getElementById('qdate');
    var pad = function(n) { return String(n).padStart(2, '0'); };
    var lastDay = new Date(year, month, 0).getDate();
    qd.min = year + '-' + pad(month) + '-01';
    qd.max = year + '-' + pad(month) + '-' + pad(lastDay);
    var inMonth = t.getFullYear() === year && t.getMonth() + 1 === month;
    qd.value = inMonth ? (t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate())) : qd.min;
    qd.addEventListener('change', query);
    document.getElementById('storeFilter').addEventListener('change', query);
    step = '顯示畫面';
    var pref = loadPref('dept');
    var start = (pref && DATA.depts[pref]) ? pref
      : (DATA.depts['03902B'] ? '03902B' : Object.keys(DATA.depts)[0]);
    setDept(start);
  } catch(e) {
    document.getElementById('updatedBadge').textContent = '資料載入失敗';
    document.getElementById('main').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
      '<div class="empty-title">無法載入班表資料</div>' +
      '<div class="empty-sub">步驟：' + step + '<br>' + String(e && e.message || e) + '</div></div>';
  }
}

function setMode(m) {
  currentMode = m;
  document.getElementById('btn-surplus').className =
    'mode-btn' + (m === 'surplus' ? ' act-surplus' : '');
  document.getElementById('btn-going').className =
    'mode-btn' + (m === 'going' ? ' act-going' : '');
  document.getElementById('btn-onshift').className =
    'mode-btn' + (m === 'onshift' ? ' act-onshift' : '');
}

// 空白 = 上班可支援；有任何非空字元 = 無法支援
function isAvailable(val) {
  return val === '' || val === null || val === undefined;
}

// 支援他店 = 欄位含「支」字
function isGoingOut(val) {
  return typeof val === 'string' && val.indexOf('支') !== -1;
}

function dateLabel(dateVal) {
  var d = new Date(dateVal);
  var w = ['日','一','二','三','四','五','六'];
  return (d.getMonth()+1) + '月' + d.getDate() + '日（週' + w[d.getDay()] + '）';
}

function empCard(emp, rightHTML, centerHTML) {
  centerHTML = centerHTML || '';
  return '<div class="emp-card">' +
    '<div style="flex:1">' +
      '<div class="emp-name">' + emp.name +
        (emp.isManager ? '<span class="star">★</span>' : '') +
      '</div>' +
      '<div class="emp-sub">' + emp.id + '　' + emp.title + '</div>' +
    '</div>' +
    (centerHTML ? '<div style="flex:1;text-align:center">' + centerHTML + '</div>' : '<div style="flex:1"></div>') +
    '<div style="text-align:right;min-width:56px">' + rightHTML + '</div>' +
  '</div>';
}

function appIcon(kind, href, label, extra) {
  return '<a href="' + href + '" class="app-icon ai-' + kind + '" title="' + label + '" aria-label="' + label + '"' +
    (extra || '') + '>' + ICONS[kind] + '</a>';
}

function storeIcons(inf, small) {
  if (!inf) return '';
  var h = '';
  if (inf.x) h += appIcon('ext', DELTAPATH_SCHEME + inf.x, 'DELTAPATH 分機 ' + inf.x,
                          ' onclick="copyExt(\'' + inf.x + '\')"');
  if (inf.t) h += appIcon('tel', 'tel:' + inf.t.replace(/-/g, ''), '市話 ' + inf.t);
  if (inf.m) h += appIcon('nav', inf.m, 'Google 地圖導航', ' target="_blank" rel="noopener"');
  return h ? '<span class="app-icons' + (small ? ' sm' : '') + '">' + h + '</span>' : '';
}

function phoneBtn(storeName) {
  return storeIcons(STORE_INFO[storeCode(storeName)], false);
}

function destCall(dest) {
  return storeIcons(STORE_INFO[storeCode(dest)], true);
}

function copyExt(ext) {
  showToast('撥打 DELTAPATH 分機 ' + ext);
  try {
    navigator.clipboard.writeText(ext).then(function() {
      showToast('撥打 DELTAPATH 分機 ' + ext + '（號碼已複製）');
    }, function() {});
  } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function query() {
  if (!DATA) return;
  var dateVal = document.getElementById('qdate').value;
  if (!dateVal) return;
  var day = parseInt(dateVal.split('-')[2], 10) - 1;
  var storeF = document.getElementById('storeFilter').value;
  var mainEl = document.getElementById('main');
  var dLabel = dateLabel(dateVal);
  var storeNames = storeF ? [storeF] : Object.keys(STORES);
  var dParts = dateVal.split('-');
  if (+dParts[0] !== DATA.meta.year || +dParts[1] !== DATA.meta.month) {
    mainEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div>' +
      '<div class="empty-title">目前只有 ' + DATA.meta.year + '年' + DATA.meta.month + '月 的班表</div>' +
      '<div class="empty-sub">請選擇該月份的日期</div></div>';
    return;
  }
  var warn = staleWarning();

  // ── 可支援門市模式 ──────────────────────────────
  if (currentMode === 'surplus') {
    var result = [];
    storeNames.forEach(function(name) {
      var emps = STORES[name] || [];
      var onShift = emps.filter(function(e) {
        return isAvailable(e.days[day]);
      });
      if (onShift.length >= 3) {
        result.push({ name: name, onShift: onShift });
      }
    });

    if (!result.length) {
      mainEl.innerHTML =
        '<div class="empty-state"><div class="empty-icon">🔍</div>' +
        '<div class="empty-title">今日無門市達到 3 人上班</div>' +
        '<div class="empty-sub">' + dLabel + '</div></div>';
      return;
    }

    result.sort(function(a, b) { return b.onShift.length - a.onShift.length; });

    var html =
      '<div class="surplus-banner">' +
        '<div>' +
          '<div class="surplus-banner-lbl">可支援門市</div>' +
          '<div class="surplus-banner-date">' + dLabel + '</div>' +
        '</div>' +
        '<div class="surplus-banner-num">' + result.length + '<span>間</span></div>' +
      '</div>';

    result.forEach(function(r) {
      html += '<div class="store-block">' +
        '<div class="store-head sh-surplus">' +
          '<span class="sh-name">' + deptChip(r.name) + r.name + '</span>' + phoneBtn(r.name) +
          '<span class="pill pill-purple">上班 ' + r.onShift.length + ' 人</span>' +
        '</div>' +
        '<div class="emp-list">';
      r.onShift.forEach(function(emp) {
        html += empCard(emp, '<span style="font-size:14px;font-weight:500;color:var(--green)">可支援</span>');
      });
      html += '</div></div>';
    });

    mainEl.innerHTML = warn + html;
    return;
  }

  // ── 當天上班人員模式 ───────────────────────────
  if (currentMode === 'onshift') {
    var result3 = [];
    storeNames.forEach(function(name) {
      var emps = STORES[name] || [];
      var on = emps.filter(function(e) { return isAvailable(e.days[day]); });
      if (on.length) result3.push({ name: name, on: on });
    });

    if (!result3.length) {
      mainEl.innerHTML =
        '<div class="empty-state"><div class="empty-icon">🔍</div>' +
        '<div class="empty-title">今日無人員上班</div>' +
        '<div class="empty-sub">' + dLabel + '</div></div>';
      return;
    }

    var totalOn = result3.reduce(function(s, r) { return s + r.on.length; }, 0);
    var html3 =
      '<div class="result-bar">' +
        '<span class="result-title">' + dLabel + '</span>' +
        '<span class="result-sub">上班共 ' + totalOn + ' 人</span>' +
      '</div>';

    result3.forEach(function(r) {
      html3 += '<div class="store-block">' +
        '<div class="store-head sh-surplus">' +
          '<span class="sh-name">' + deptChip(r.name) + r.name + '</span>' + phoneBtn(r.name) +
          '<span class="pill pill-purple">上班 ' + r.on.length + ' 人</span>' +
        '</div>' +
        '<div class="emp-list">';
      r.on.forEach(function(emp) {
        html3 += empCard(emp, '<span style="font-size:14px;font-weight:500;color:var(--green)">上班中</span>');
      });
      html3 += '</div></div>';
    });

    mainEl.innerHTML = warn + html3;
    return;
  }

  // ── 支援他店模式 ────────────────────────────────
  var result2 = [];
  storeNames.forEach(function(name) {
    var emps = STORES[name] || [];
    var going = emps.filter(function(e) {
      return isGoingOut(e.days[day]);
    });
    if (going.length) result2.push({ name: name, going: going });
  });

  if (!result2.length) {
    mainEl.innerHTML =
      '<div class="empty-state"><div class="empty-icon">🔍</div>' +
      '<div class="empty-title">今日無人員支援他店</div>' +
      '<div class="empty-sub">' + dLabel + '</div></div>';
    return;
  }

  var total = result2.reduce(function(s, r) { return s + r.going.length; }, 0);
  var html2 =
    '<div class="result-bar">' +
      '<span class="result-title">' + dLabel + '</span>' +
      '<span class="result-sub">共 ' + total + ' 人外出支援</span>' +
    '</div>';

  result2.forEach(function(r) {
    html2 += '<div class="store-block">' +
      '<div class="store-head sh-going">' +
        '<span class="sh-name">' + deptChip(r.name) + r.name + '</span>' + phoneBtn(r.name) +
        '<span class="pill pill-blue">' + r.going.length + ' 人外出</span>' +
      '</div>' +
      '<div class="emp-list">';
    r.going.forEach(function(emp) {
      var dest = (emp.dests && emp.dests[day]) ? emp.dests[day] : '';
      var rightHTML =
        '<span class="tag tag-going">支援他店</span>' +
        (dest ? '<div class="dest-lbl">→ ' + dest + '</div>' + destCall(dest) : '');
      html2 += empCard(emp, rightHTML);
    });
    html2 += '</div></div>';
  });

  mainEl.innerHTML = warn + html2;
}

loadData();
</script>

</html>
